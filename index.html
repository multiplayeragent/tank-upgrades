<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #c9ced8; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #2a3142; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; cursor: crosshair; }
  .hud { position: fixed; pointer-events: none; }
  #score { top: max(12px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); font-weight: 900; font-size: 26px; line-height: 1.05; text-shadow: 0 2px 0 #fff; }

         box-shadow: 0 2px 12px #0000001f; font-size: 13px; }

  #top div { display: flex; align-items: center; gap: 8px; } #top i { width: 10px; height: 10px; border-radius: 50%; flex: none; }

  #feed { top: calc(max(12px, env(safe-area-inset-top)) + 140px); right: max(14px, env(safe-area-inset-right)); font-size: 12px; font-weight: 700; text-align: right; text-shadow: 0 1px 0 #fff; }
  #feed div { margin-top: 3px; }
  #toast { top: 15%; left: 0; right: 0; text-align: center; font-size: 26px; font-weight: 900; text-shadow: 0 2px 0 #fff, 0 0 14px #fff; transition: opacity .4s; }
  #hint { bottom: calc(max(14px, env(safe-area-inset-bottom)) + 64px); left: 0; right: 0; padding: 0 16px; text-align: center; font-size: 14px; font-weight: 700; transition: opacity .8s; }
  #hint span { display: inline-block; padding: 7px 16px; border-radius: 14px; background: #ffffffe0; box-shadow: 0 2px 10px #0000001f; }
  #xpbar { bottom: calc(max(12px, env(safe-area-inset-bottom)) + 22px); left: 50%; transform: translateX(-50%); width: min(380px, 60vw); height: 20px; border-radius: 10px;
           background: #2a3142cc; border: 3px solid #2a3142; overflow: hidden; }
  #xpbar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#ffe27a, #f5c43a); transition: width .25s; }
  #xpbar span { position: absolute; inset: 0; text-align: center; font: 800 12px/20px system-ui, sans-serif; color: #fff; text-shadow: 0 1px 2px #000; }
  #net { bottom: max(10px, env(safe-area-inset-bottom)); left: max(14px, env(safe-area-inset-left)); font-size: 12px; opacity: .7; }
  #ups { position: fixed; left: max(14px, env(safe-area-inset-left)); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 26px); width: 210px; padding: 8px 10px 10px;
         border-radius: 14px; background: #2a3142e6; color: #fff; box-shadow: 0 4px 16px #0003; }
  .touch #ups { bottom: auto; top: calc(max(12px, env(safe-area-inset-top)) + 64px); width: 180px; }
  #ups h4 { margin: 0 0 6px; font-size: 13px; color: #ffe27a; }
  #ups button { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; margin-top: 4px; padding: 0 8px; border: 0; border-radius: 10px;
                background: #ffffff14; color: #fff; font: 700 13px system-ui, sans-serif; cursor: pointer; touch-action: none; }
  #ups button:disabled { opacity: .45; cursor: default; }
  #ups button:not(:disabled):hover, #ups button:not(:disabled):active { background: #ffffff2e; }
  #ups em { font-style: normal; width: 54px; text-align: left; } #ups u { flex: 1; display: flex; gap: 3px; text-decoration: none; }
  #ups u i { flex: 1; height: 8px; border-radius: 3px; background: #ffffff26; } #ups kbd { font: 700 11px system-ui; opacity: .6; }
  .touch #ups kbd { display: none; }
  #pick { position: fixed; top: 31%; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 10px;
          border-radius: 16px; background: #2a3142e6; box-shadow: 0 4px 16px #0003; }
  #pick h4 { position: absolute; top: -26px; left: 0; right: 0; margin: 0; text-align: center; font-size: 15px; font-weight: 900; text-shadow: 0 1px 0 #fff; color: #2a3142; }
  #pick button { width: 92px; min-height: 92px; border: 0; border-radius: 12px; background: #ffffff14; color: #fff; font: 800 13px system-ui, sans-serif; cursor: pointer; touch-action: none; }
  #pick button:hover, #pick button:active { background: #ffffff30; } #pick canvas { width: 56px; height: 56px; display: block; margin: 0 auto 4px; }
  #pick kbd { font: 700 11px system-ui; opacity: .6; } .touch #pick kbd { display: none; }
  .touch #pick { top: calc(max(12px, env(safe-area-inset-top)) + 150px); } .touch #toast { top: 38%; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #2a314255; }
  #ups[hidden], #pick[hidden], #over[hidden], .stick[hidden] { display: none; }
  .card { box-sizing: border-box; width: min(380px, calc(100vw - 32px)); max-height: 84vh; overflow: auto; padding: 22px; border-radius: 18px; background: #fff; box-shadow: 0 10px 40px #0003; text-align: center; }
  .card h2 { margin: 0 0 4px; font-size: 25px; }
  .card h3 { margin: 16px 0 4px; font-size: 12px; color: #7a839a; text-transform: uppercase; letter-spacing: .06em; text-align: left; }
  .card ol { text-align: left; margin: 0 0 16px; padding-left: 26px; font-size: 14px; min-height: 40px; }
  .card li span { float: right; font-variant-numeric: tabular-nums; }
  button.go { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: #2fb36d; color: #fff; font: 800 17px system-ui, sans-serif; cursor: pointer; box-shadow: 0 4px 0 #23864f; }
  .stick { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid #2a314255; background: #2a314214; pointer-events: none; }
  .stick i { position: absolute; left: 34px; top: 34px; width: 52px; height: 52px; border-radius: 50%; background: #2a314266; }
  @media (max-width: 640px) { #top { width: 128px; font-size: 12px; } #score { font-size: 22px; } #pick button { width: 80px; min-height: 84px; } }
</style>

<body>
<canvas id="game"></canvas>
<div class="hud" id="score"></div>

    <button class="go" id="again">Play again</button>
  </div>
</div>
<script>
/* ═══ TANK UPGRADES · a Multiplayer Agent starter ══════════════════════════════════════
 * Shoot shapes for XP, level up your tank, take on the others. Drop-in, 2–16 players;
 * bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ every number worth tuning: arena, stats, shapes, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   TANKS ......... levels, the four stats, the tank classes and firing (shared by players and bots)
 *   BULLETS ....... bullets every screen flies, and who decides a hit
 *   WORLD (HOST) .. the shapes and the bots. Only the host writes these.
 *   BOT BRAIN ..... how a bot picks a target, moves, aims and spends its points
 *   ME ............ moving, shooting, upgrading, getting hit, respawning. Each player writes its own.
 *   OTHERS ........ everyone else's tanks and the shapes, eased between snapshots
 *   DRAW .......... camera, floor, shapes, bullets, tanks, effects, minimap
 *   HUD & OVER .... score, XP bar, upgrade panel, tank picker, top 5, feed, game-over card, sound
 *   INPUT ......... WASD + mouse, keys 1–7, twin thumb sticks on touch
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (one packed JSON field: x, y, velocity, aim, hp,
 *     max hp, level, class, score, dead, shield) about 10 times a second, `hb` (heartbeat)
 *     once a second, and `n`/`c` (name, color) once. Your score, level and stats are your own.
 *   - Shots are events: "shot" {b: [[x, y, angle, msAgo]…], s, d, r} (speed, damage, size),
 *     batched 10 times a second. Every screen flies every bullet the same way.
 *   - A HIT ON A TANK IS THE VICTIM'S OWN FACT: only you check bullets against yourself, take
 *     the damage, and at 0 hp you send "down" {v: you, by: shooter, xp}. The shooter adds xp.
 *     (The host does this for bots.) Elsewhere a bullet just stops with a spark.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields `shapes` (every shape:
 *     [id, kind, x, y, hp]) and `bots`. The host decides which bullets break shapes and sends
 *     "xp" {to, n} to the player who broke one. A new host adopts both fields and carries on.
 *   - Bot shots go out batched, 10 times a second: "shots" {list: [[bot, x, y, a, s, d, r, ago]…]}.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "top-score": each player's best score in one life, shown when you're destroyed.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  map: 2400,            // the arena is map × map px
  seats: 8,             // bots fill the arena up to this many tanks
  shapes: 56,           // shapes kept on the map (keep it under ~80: they share one field)
  maxLevel: 29,         // one upgrade point for every level after the first
  maxStat: 7,           // most points one stat can take
  classAt: 10,          // the level where you pick a new tank
  hp: 60,               // health at level 1; each Armor point adds hpPerPoint
  hpPerPoint: 22,
  regen: 0.05,          // share of max health healed per second, 3s after the last hit
  speed: 210,           // px/s; each Speed point adds speedPerPoint
  speedPerPoint: 16,
  reload: 0.5,          // seconds between shots; each Reload point cuts 13%
  damage: 8,            // per bullet; each Damage point adds damagePerPoint
  damagePerPoint: 3.5,
  bulletSpeed: 620,     // px/s
  bulletLife: 1.2,      // seconds before a bullet fizzles
  respawnMs: 3000,      // ms a bot stays down
  shieldMs: 2500,       // ms nobody can hurt you after you spawn
  killXp: 0.5,          // share of a destroyed tank's score its killer gets (+20)
  botLevel: [1, 12],    // bots join at a random level in this range
  botAim: 0.12,         // radians a bot's aim wanders
  botAggr: [0.3, 0.9],  // how keen each bot is to pick a fight instead of farming shapes (0..1)
  botRange: 620,        // px: bots pick fights this close
  board: "top-score",   // leaderboard name
};
// Shapes: kind 0..2. xp = score for breaking one.
const SHAPES = [
  { name: "square", sides: 4, r: 17, hp: 10, xp: 10, color: "#ffd23f", share: 0.6 },
  { name: "triangle", sides: 3, r: 19, hp: 30, xp: 25, color: "#ff7a7a", share: 0.28 },
  { name: "pentagon", sides: 5, r: 32, hp: 110, xp: 130, color: "#7f8cff", share: 0.12 },
];
// Tank classes. Each barrel: [angle offset, side offset, length, width, tip width] (× the tank's radius).
const CLASSES = {
  basic: { name: "Tank", barrels: [[0, 0, 1.9, 0.85]], reload: 1, damage: 1, speed: 1, spread: 0.03, view: 1 },
  twin: { name: "Twin", barrels: [[0, -0.45, 1.85, 0.72], [0, 0.45, 1.85, 0.72]], reload: 1, damage: 0.7, speed: 1, spread: 0.05, view: 1 },
  sniper: { name: "Sniper", barrels: [[0, 0, 2.5, 0.8]], reload: 1.5, damage: 1.7, speed: 1.5, spread: 0.01, view: 1.25 },
  gunner: { name: "Gunner", barrels: [[0, 0, 1.7, 0.85, 1.35]], reload: 0.42, damage: 0.55, speed: 0.9, spread: 0.2, view: 1 },
};
const PICKS = ["twin", "sniper", "gunner"];
const STATS = ["Speed", "Reload", "Damage", "Armor"];
const STAT_COLORS = ["#5ad1ff", "#ffd23f", "#ff7a7a", "#7bea8c"];
const BOT_NAMES = ["Rumble", "Turret", "Bolt", "Sarge", "Piston", "Gizmo", "Tread", "Flak", "Major", "Cog", "Rivet", "Howitzer", "Dozer", "Mortar"];
const COLORS = ["#3a86ff", "#f2545b", "#2fb36d", "#8f5cf7", "#fb8b24", "#ff5fa8", "#14b8c4", "#a3b818", "#b5446e", "#3b4cca", "#d4a017", "#6d6875"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'tank-upgrades',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
if (ATTRACT) Object.assign(CONFIG, { map: 1150, seats: 8, shapes: 42, botLevel: [8, 22], respawnMs: 1000, shieldMs: 600, botRange: 700, botAggr: [0.85, 1] });

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const parsed = new Map();
/** A JSON value from state, parsed once per change (read-only: never mutate what this returns). */
function parseOnce(key, raw, fallback) {
  const c = parsed.get(key);
  if (c && c.raw === raw) return c.v;
  const v = parse(raw, fallback); parsed.set(key, { raw, v }); return v;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;

// ── TANKS ───────────────────────────────────────────────────────────────────────────
// A tank (me or a bot): { id, name, color, x, y, vx, vy, a (aim), hp, xp (score), lv, st: [speed,
// reload, damage, armor], cl (class), dead, shieldUntil, cd (reload left) }.
const M = CONFIG.map;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (list) => list[Math.floor(Math.random() * list.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const xpFor = (lv) => Math.round(6 * (lv - 1) ** 2.1); // total score needed to reach a level
function levelFor(xp) { let lv = 1; while (lv < CONFIG.maxLevel && xp >= xpFor(lv + 1)) lv++; return lv; }
const tankR = (lv) => 22 + lv * 0.5;
const maxHp = (t) => Math.round(CONFIG.hp + t.st[3] * CONFIG.hpPerPoint + t.lv * 2);
const speedOf = (t) => (CONFIG.speed + t.st[0] * CONFIG.speedPerPoint) * (1 - t.lv * 0.005);
const reloadOf = (t) => CONFIG.reload * Math.pow(0.87, t.st[1]) * CLASSES[t.cl].reload;
const damageOf = (t) => (CONFIG.damage + t.st[2] * CONFIG.damagePerPoint) * CLASSES[t.cl].damage;
const bulletSpeedOf = (t) => CONFIG.bulletSpeed * CLASSES[t.cl].speed * (1 + t.st[2] * 0.03);
const bulletR = (t) => (7 + t.st[2] * 0.6) * (t.cl === "gunner" ? 0.75 : 1) * (1 + t.lv * 0.01);
const pointsLeft = (t) => t.lv - 1 - t.st.reduce((a, b) => a + b, 0);

function newTank(id, name, color) {
  return { id, name, color, x: M / 2, y: M / 2, vx: 0, vy: 0, a: 0, hp: CONFIG.hp, xp: 0, lv: 1, st: [0, 0, 0, 0], cl: "basic", dead: 0, shieldUntil: 0, cd: 0, hurtAt: -1e9, firedAt: -1e9, kills: 0 };
}
/** Score went up: work out the new level. Returns how many levels were gained. */
function gainXp(t, n) {
  const before = t.lv;
  t.xp = Math.max(0, Math.round(t.xp + n)); t.lv = levelFor(t.xp);
  if (t.lv > before) t.hp += (maxHp(t) - (CONFIG.hp + t.st[3] * CONFIG.hpPerPoint + before * 2)); // the level's extra health comes full
  return t.lv - before;
}
/** Spend one point on stat i (0..3) if there's a point and room. */
function upgrade(t, i) {
  if (pointsLeft(t) <= 0 || t.st[i] >= CONFIG.maxStat) return false;
  t.st[i]++;
  if (i === 3) t.hp += CONFIG.hpPerPoint;
  return true;
}
/** Fire every barrel. Returns the new shots as [x, y, angle]; the caller flies and sends them. */
function fire(t) {
  const c = CLASSES[t.cl], r = tankR(t.lv), out = [];
  for (const [ang, side, len] of c.barrels) {
    const base = t.a + ang, a = base + (Math.random() - 0.5) * 2 * c.spread;
    out.push([Math.round(t.x + Math.cos(base) * r * len - Math.sin(base) * r * side), Math.round(t.y + Math.sin(base) * r * len + Math.cos(base) * r * side), +a.toFixed(3)]);
  }
  t.cd = reloadOf(t); t.firedAt = performance.now();
  const kick = 18 * c.damage * c.barrels.length; t.vx -= Math.cos(t.a) * kick; t.vy -= Math.sin(t.a) * kick; // recoil
  return out;
}
/** Keep a tank in the arena and out of the shapes (it shoves them aside on the host). */
function pushOut(t, list) {
  const r = tankR(t.lv);
  for (const s of list) {
    const d = dist(t, s), min = r + SHAPES[s.k].r * 0.9;
    if (d < min && d > 0.01) { const k = (min - d) / d; t.x += (t.x - s.x) * k * 0.6; t.y += (t.y - s.y) * k * 0.6; if (s.vx !== undefined) { s.vx -= (t.x - s.x) / d * 40; s.vy -= (t.y - s.y) / d * 40; } }
  }
  t.x = Math.max(r, Math.min(M - r, t.x)); t.y = Math.max(r, Math.min(M - r, t.y));
}

// ── BULLETS ─────────────────────────────────────────────────────────────────────────
const bullets = [];
function addBullet(owner, x, y, a, speed, dmg, r, ago = 0) {
  const t = tankById(owner), b = { owner, x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: CONFIG.bulletLife, r, d: dmg, late: 0, color: t ? t.color : "#888" };
  b.late = Math.min(0.15, Math.max(0, ago / 1000)); // it left the barrel `ago` ms ago: it flies that much extra (checking hits) on its first frames
  bullets.push(b);
  const v = views.get(owner); if (v) v.firedAt = performance.now();
}
/** Move every bullet. Shapes and tanks stop them. Who gets hurt is decided by the one hit (the host for shapes and bots). */
function stepBullets(dt) {
  const tanks = allTanks().filter((t) => !t.dead), shapes = shapeList(), now = Date.now();
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i], step = dt + b.late * 0.5, n = Math.ceil((Math.hypot(b.vx, b.vy) * step) / 16); // small sub-steps: fast bullets can't skip a shape
    b.late *= 0.5;
    let gone = (b.life -= step) <= 0;
    for (let k = 0; k < n && !gone; k++) {
      b.x += b.vx * step / n; b.y += b.vy * step / n;
      if (b.x < 0 || b.y < 0 || b.x > M || b.y > M) { gone = true; break; }
      for (const s of shapes) {
        if (gone || (b.x - s.x) ** 2 + (b.y - s.y) ** 2 > (SHAPES[s.k].r + b.r) ** 2) continue;
        gone = true; spark(b.x, b.y, SHAPES[s.k].color, 5);
        if (world.acting) hitShape(s, b);
      }
      for (const t of tanks) {
        if (gone || t.id === b.owner || (b.x - t.x) ** 2 + (b.y - t.y) ** 2 > (tankR(t.lv) + b.r) ** 2) continue;
        gone = true; spark(b.x, b.y, t.color, 7);
        if (now < t.shieldUntil || t.sh) continue;
        if (t === me) takeHit(b.owner, b.d);                       // me: my own fact
        else if (t.bot && world.acting) hitBot(t, b.owner, b.d);  // a bot: the host decides
        else if (b.owner === me.id) sfx("tick");
      }
    }
    if (gone) bullets.splice(i, 1);
  }
}

// ── WORLD (HOST) ────────────────────────────────────────────────────────────────────
const world = { acting: false, shapes: new Map(), nextId: 1, bots: new Map(), lastShapes: 0, lastBots: 0, lastSpawn: 0, shots: [] };
function adoptWorld() {
  world.acting = true; world.shapes.clear(); world.bots.clear();
  for (const [id, k, x, y, hp] of parseOnce("shapes", S.shared.shapes, [])) if (SHAPES[k]) world.shapes.set(id, { id, k, x, y, hp, vx: 0, vy: 0, flash: 0 });
  world.nextId = Math.max(0, ...world.shapes.keys()) + 1;

// ── OTHERS ──────────────────────────────────────────────────────────────────────────
const views = new Map();       // id -> someone else's tank (a person, or a bot on a non-host screen), eased toward its snapshots
const shapeViews = new Map();  // id -> a shape on a non-host screen, eased
function syncViews(dt) {
  const k = 1 - Math.pow(0.0005, dt), seen = new Set(), live = new Set(livePlayers()), now = performance.now();
  const add = (id, q, name, color, bot) => {
    if (!q || typeof q.x !== "number") return;
    seen.add(id);
    let v = views.get(id);
    if (!v) { v = { id, bot, x: q.x, y: q.y, a: q.a || 0, firedAt: -1e9, hurtAt: -1e9, raw: null }; views.set(id, v); }
    if (v.dead && !q.d) { v.x = q.x; v.y = q.y; } // respawned: no easing across the map
    if (q.hp < v.hp) v.hurtAt = now;
    Object.assign(v, { name, color, vx: q.vx || 0, vy: q.vy || 0, hp: q.hp, mhp: q.mhp || 100, xp: q.xp || 0, lv: levelFor(q.xp || 0), cl: CLASSES[q.cl] ? q.cl : "basic", dead: q.d ? 1 : 0, sh: q.sh ? 1 : 0, shieldUntil: 0, raw: q });

  if (!world.acting) for (const b of parseOnce("bots", S.shared.bots, [])) add(b.i, b, b.n, b.c, true);
  for (const id of views.keys()) if (!seen.has(id)) views.delete(id);
  // shapes (the host uses its own)
  if (world.acting) { shapeViews.clear(); return; }
  const ids = new Set();
  for (const [id, kind, x, y, hp] of parseOnce("shapes", S.shared.shapes, [])) {
    if (!SHAPES[kind]) continue;
    ids.add(id);
    let s = shapeViews.get(id);
    if (!s) { s = { id, k: kind, x, y, hp, flash: 0 }; shapeViews.set(id, s); }
    if (hp < s.hp) s.flash = now;

function allTanks() {

    if (k >= "1" && k <= "4") spend(+k - 1);

// Twin thumb sticks: touch the left half to move, the right half to aim (and shoot).
const sticks = { move: null, aim: null };
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (e.pointerType === "mouse") { if (e.button === 0) mouse.down = true; return; }
  const side = e.clientX < innerWidth / 2 ? "move" : "aim";
  if (sticks[side]) return;
  sticks[side] = { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, el: $(side === "move" ? "stickMove" : "stickAim") };

    let dx = e.clientX - s.x0, dy = e.clientY - s.y0; const d = Math.hypot(dx, dy);
    if (d > 50) { dx *= 50 / d; dy *= 50 / d; }

  }

for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, (e) => {

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (!isHost()) world.acting = false;
  syncViews(dt);
  if (isHost()) hostTick(dt, now);
  if (me.wantSpawn) { me.wantSpawn = false; spawnMe(); }
  if (!ATTRACT) readInput();
  myTick(dt);
  stepBullets(dt);
  if (now - me.hurtAt < 30 && !ATTRACT) cam.shake = 8;
  draw(dt, now);
  if (now - lastHud > 150) { lastHud = now; hud(now); }
}

  });
  net.on("shots", (msg) => { if (msg && Array.isArray(msg.list)) for (const [id, x, y, a, s, d, r, ago] of msg.list.slice(0, 40)) addBullet(id, x, y, a, s, d, r, ago); });

  net.onDisconnect(() => { netDown = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { netDown = false; });

  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...botColors()]);
  me.id = net.sessionId; me.color = COLORS.find((c) => !taken.has(c)) || pick(COLORS);
  net.me.set({ n: myName, c: me.color, hb: Date.now() });
  startedAt = performance.now(); me.wantSpawn = true;
  requestAnimationFrame(frame);
})();
</script>
